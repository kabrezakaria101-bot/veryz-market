<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — VERYZ MARKET</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main><div class="container">
    <div class="panel narrow">
      <div class="tabs">
        <button class="btn" id="tab-login" type="button">Connexion</button>
        <button class="btn light" id="tab-register" type="button">Créer un compte</button>
      </div>
      <form id="form-login">
        <label>Téléphone</label><input name="phone" inputmode="numeric" placeholder="70123456" required>
        <label>Mot de passe</label><input name="password" type="password" required>
        <p><button class="btn" type="submit" style="width:100%">Se connecter</button></p>
      </form>
      <form id="form-register" class="hidden">
        <label>Nom complet</label><input name="full_name" required>
        <label>Téléphone</label><input name="phone" inputmode="numeric" placeholder="70123456" required>
        <label>Ville</label><input name="city" placeholder="Ouagadougou">
        <label>Mot de passe (6 caractères min.)</label><input name="password" type="password" minlength="6" required>
        <p><button class="btn orange" type="submit" style="width:100%">Créer mon compte</button></p>
      </form>
    </div>
  </div></main>
  <div id="app-footer"></div>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
