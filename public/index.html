<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERYZ MARKET — Achète. Vends. Trouve près de chez toi.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <section class="hero">
    <div class="container">
      <h1>Achète. Vends. Trouve près de chez toi.</h1>
      <p>La plateforme locale : vendeurs du quartier, bonnes affaires, paiement Mobile Money.</p>
      <form id="search-form" class="search">
        <input name="q" type="search" placeholder="Que cherches-tu ? (téléphone, moto, sac…)">
        <select name="category"></select>
        <input name="city" placeholder="Ville (Ouagadougou…)">
        <button class="btn orange" type="submit">Rechercher</button>
      </form>
    </div>
  </section>
  <main>
    <div class="container">
      <div class="chips" id="chips"></div>
      <h2 id="list-title">Dernières annonces</h2>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
